<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <defs>
    <linearGradient id="bridge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8441A"/>
      <stop offset="50%" stop-color="#F07A30"/>
      <stop offset="100%" stop-color="#5FC8D8"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Bridge tower -->
  <rect x="36" y="4" width="5" height="30" fill="url(#bridge-grad)" opacity="0.95"/>
  <!-- Tower crossbars -->
  <rect x="33" y="10" width="11" height="2.5" rx="1" fill="url(#bridge-grad)" opacity="0.8"/>
  <rect x="33" y="17" width="11" height="2.5" rx="1" fill="url(#bridge-grad)" opacity="0.8"/>
  <!-- Tower cap -->
  <polygon points="38.5,2 34,8 43,8" fill="#E8441A" opacity="0.9"/>

  <!-- Left suspension cable -->
  <line x1="38.5" y1="4" x2="4" y2="28" stroke="url(#bridge-grad)" stroke-width="1.2" opacity="0.75"/>
  <!-- Right suspension cable -->
  <line x1="38.5" y1="4" x2="73" y2="28" stroke="#5FC8D8" stroke-width="1.2" opacity="0.75"/>

  <!-- Bridge deck -->
  <rect x="2" y="27" width="73" height="4" rx="2" fill="url(#bridge-grad)" opacity="0.85"/>

  <!-- Vertical hangers -->
  <line x1="15" y1="18" x2="15" y2="27" stroke="#E8441A" stroke-width="0.8" opacity="0.5"/>
  <line x1="25" y1="12" x2="25" y2="27" stroke="#E8441A" stroke-width="0.8" opacity="0.5"/>
  <line x1="52" y1="12" x2="52" y2="27" stroke="#5FC8D8" stroke-width="0.8" opacity="0.5"/>
  <line x1="62" y1="18" x2="62" y2="27" stroke="#5FC8D8" stroke-width="0.8" opacity="0.5"/>

  <!-- Anchor dots -->
  <circle cx="4" cy="28" r="2" fill="#E8441A" opacity="0.9"/>
  <circle cx="73" cy="28" r="2" fill="#5FC8D8" opacity="0.9"/>

  <!-- Wordmark -->
  <text x="82" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-1" fill="url(#text-grad)">VEX</text>
</svg>
